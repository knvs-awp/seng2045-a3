{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block scripts %}
    <script src="{% static 'profiles/main.js' %}" defer></script>
{% endblock scripts %}

{% block title %}
my profile
{% endblock title %}

{% block content %}
    <div class="profile-panel mx-auto">
        <div id="alert-box"></div>
        <div class="border rounded-3 p-4 p-md-5">
            <h3 class="mb-4 text-break">{{obj.user}}</h3>
            <div class="row g-4">
                <div class="col-md-4 text-center" id="avatar-box">
                    <img src="{{obj.avatar.url}}" class="rounded" height="200px" width="auto" alt="{{obj.user.username}}">
                </div>
                <div class="col-md-8">
                    <form id="profile-form">
                        {% csrf_token %}
                        {{form|crispy}}
                        <button type="submit" class="btn btn-primary mt-2 px-4">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
